id: io.github.networkoctopus.Crumbs
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: crumbs

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    # Development only. Flathub builds must use generated offline Cargo sources.
    - --share=network

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --filesystem=home:ro
  - --filesystem=xdg-download
  - --filesystem=~/.var/app:ro
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.secrets

modules:
  - name: libfuse
    buildsystem: meson
    config-opts:
      - --libdir=/app/lib
      - -Dutils=false
      - -Dexamples=false
      - -Dtests=false
    cleanup:
      - /include
      - /lib/pkgconfig
    post-install:
      - install -Dm644 ../LICENSE /app/share/doc/crumbs/libfuse/LICENSE
      - install -Dm644 ../LGPL2.txt /app/share/doc/crumbs/libfuse/LGPL2.txt
    sources:
      - type: git
        url: https://github.com/libfuse/libfuse.git
        tag: fuse-3.16.2
        commit: 7a92727d97c10290b3501d86a194738973edb61d

  - name: proxmox-backup-client
    buildsystem: simple
    build-options:
      env:
        LIBRARY_PATH: /app/lib
        REPOID: 035c449897fafc228c8bbf3a5b5ba38564478ac7
        RUSTFLAGS: -C link-arg=-Wl,-rpath,$ORIGIN/../lib
    build-commands:
      - patch --forward --strip=1 --directory=proxmox-backup --input="$PWD/pbs-client-path-dependencies.patch"
      - cargo build --locked --release --manifest-path=proxmox-backup/Cargo.toml --package=proxmox-backup-client --bin=proxmox-backup-client
      - install -Dm755 proxmox-backup/target/release/proxmox-backup-client /app/bin/proxmox-backup-client
    sources:
      - type: git
        url: https://git.proxmox.com/git/proxmox-backup.git
        commit: 035c449897fafc228c8bbf3a5b5ba38564478ac7
        dest: proxmox-backup
      - type: git
        url: https://git.proxmox.com/git/proxmox.git
        commit: 22c4d5ecbfce6eb2fd566181e0b7d23ac2df4f0c
        dest: proxmox
      - type: git
        url: https://git.proxmox.com/git/proxmox-fuse.git
        commit: ac99ac97f7c2eb7ab9ee6ec3b41034e68b1eca7d
        dest: proxmox-fuse
      - type: git
        url: https://git.proxmox.com/git/pxar.git
        commit: 091a8a382d0d6fc71025351fb35c51b1f3b0074d
        dest: pxar
      - type: git
        url: https://git.proxmox.com/git/pathpatterns.git
        commit: 5323cbe49ae5d592eb8a3fa2e215550e83dd7fba
        dest: pathpatterns
      - type: file
        path: build-aux/pbs-client-path-dependencies.patch
        dest-filename: pbs-client-path-dependencies.patch
      - type: file
        path: build-aux/pbs-client.Cargo.lock
        dest: proxmox-backup
        dest-filename: Cargo.lock

  - name: crumbs
    buildsystem: simple
    build-commands:
      - cargo build --locked --release
      - install -Dm755 target/release/crumbs /app/bin/crumbs
      - install -Dm644 data/io.github.networkoctopus.Crumbs.desktop /app/share/applications/io.github.networkoctopus.Crumbs.desktop
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.networkoctopus.Crumbs.svg /app/share/icons/hicolor/scalable/apps/io.github.networkoctopus.Crumbs.svg
      - install -Dm644 data/io.github.networkoctopus.Crumbs.metainfo.xml /app/share/metainfo/io.github.networkoctopus.Crumbs.metainfo.xml
      - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/doc/crumbs/THIRD_PARTY_NOTICES.md
      - install -Dm644 LICENSES/AGPL-3.0.txt /app/share/doc/crumbs/LICENSES/AGPL-3.0.txt
    sources:
      - type: dir
        path: .

id: io.github.networkoctopus.Crumbs
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: crumbs

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    # Development only. Flathub builds must use generated offline Cargo sources.
    - --share=network

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --filesystem=home:ro
  - --filesystem=xdg-download
  - --filesystem=~/.var/app:ro
  - --system-talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.secrets

modules:
  - name: proxmox-backup-client
    buildsystem: simple
    build-commands:
      - ar x proxmox-backup-client-static_4.2.3-1_amd64.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/proxmox-backup-client /app/bin/proxmox-backup-client
    sources:
      - type: file
        url: http://download.proxmox.com/debian/pbs-client/dists/trixie/main/binary-amd64/proxmox-backup-client-static_4.2.3-1_amd64.deb
        sha256: 05ac991e89a6e899d3f236c15d13ba736221a44f138314f42cac22867ae46d55

  - name: crumbs
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/crumbs /app/bin/crumbs
      - install -Dm644 data/io.github.networkoctopus.Crumbs.desktop /app/share/applications/io.github.networkoctopus.Crumbs.desktop
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.networkoctopus.Crumbs.svg /app/share/icons/hicolor/scalable/apps/io.github.networkoctopus.Crumbs.svg
      - install -Dm644 data/io.github.networkoctopus.Crumbs.metainfo.xml /app/share/metainfo/io.github.networkoctopus.Crumbs.metainfo.xml
      - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/doc/crumbs/THIRD_PARTY_NOTICES.md
      - install -Dm644 LICENSES/AGPL-3.0.txt /app/share/doc/crumbs/LICENSES/AGPL-3.0.txt
    sources:
      - type: dir
        path: .


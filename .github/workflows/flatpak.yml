name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: io.github.networkoctopus.Crumbs
  MANIFEST: io.github.networkoctopus.Crumbs.Devel.yml
  FLATPAK_REMOTE_NAME: networkoctopus
  FLATPAK_REPO_URL: https://networkoctopus.github.io/flatpak/
  FLATPAKREPO_FILE: networkoctopus.flatpakrepo

jobs:
  build:
    name: Build Flatpak
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.gpg.outputs.signed }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 flatpak flatpak-builder gpg

      - name: Add Flathub
        run: |
          dbus-run-session -- flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install runtimes
        run: |
          dbus-run-session -- flatpak --user install -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Import GPG signing key
        id: gpg
        shell: bash
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "${FLATPAK_GPG_PRIVATE_KEY}" || -z "${FLATPAK_GPG_KEY_ID}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Flatpak GPG signing secrets configured; building an unsigned repo artifact."
            exit 0
          fi

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\n' > ~/.gnupg/gpg-agent.conf
          printf 'batch\nno-tty\npinentry-mode loopback\n' > ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

          printf '%s' "${FLATPAK_GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --batch --list-secret-keys "${FLATPAK_GPG_KEY_ID}"

          if [[ -n "${FLATPAK_GPG_PASSPHRASE}" ]]; then
            printf 'crumbs signing probe' > /tmp/crumbs-signing-probe
            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "${FLATPAK_GPG_PASSPHRASE}" \
              --local-user "${FLATPAK_GPG_KEY_ID}" \
              --detach-sign \
              /tmp/crumbs-signing-probe
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build repository
        shell: bash
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          SIGNED: ${{ steps.gpg.outputs.signed }}
        run: |
          set -euo pipefail

          sign_args=()
          if [[ "${SIGNED}" == "true" ]]; then
            sign_args+=(--gpg-sign="${FLATPAK_GPG_KEY_ID}")
          fi

          dbus-run-session -- flatpak-builder \
            --user \
            --force-clean \
            --install-deps-from=flathub \
            --repo=repo \
            "${sign_args[@]}" \
            build-dir \
            "${MANIFEST}"

          if [[ "${SIGNED}" == "true" ]]; then
            flatpak build-update-repo --gpg-sign="${FLATPAK_GPG_KEY_ID}" repo
          else
            flatpak build-update-repo repo
          fi

      - name: Generate flatpakrepo file
        shell: bash
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          SIGNED: ${{ steps.gpg.outputs.signed }}
        run: |
          set -euo pipefail

          repo_url="${FLATPAK_REPO_URL}"
          gpg_key=""
          no_gpg_verify="true"

          if [[ "${SIGNED}" == "true" ]]; then
            gpg_key="$(gpg --armor --export "${FLATPAK_GPG_KEY_ID}" | base64 -w0)"
            no_gpg_verify="false"
          fi

          python3 build-aux/render-flatpakrepo.py \
            --template build-aux/io.github.networkoctopus.Crumbs.flatpakrepo.in \
            --output "repo/${FLATPAKREPO_FILE}" \
            --repo-url "${repo_url}" \
            --gpg-key "${gpg_key}" \
            --no-gpg-verify "${no_gpg_verify}"

      - name: Build single-file bundle
        run: |
          flatpak build-bundle repo "${APP_ID}.flatpak" "${APP_ID}" master

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: crumbs-flatpak-bundle
          path: ${{ env.APP_ID }}.flatpak

      - name: Upload Flatpak repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: networkoctopus-flatpak-repo
          path: repo

      - name: Publish shared networkoctopus Flatpak repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.gpg.outputs.signed == 'true'
        shell: bash
        env:
          FLATPAK_PUBLISH_TOKEN: ${{ secrets.FLATPAK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${FLATPAK_PUBLISH_TOKEN}" ]]; then
            echo "::error::FLATPAK_PUBLISH_TOKEN is required to publish networkoctopus/flatpak"
            exit 1
          fi

          publish_dir="${RUNNER_TEMP}/networkoctopus-flatpak-pages"
          rm -rf "${publish_dir}"
          mkdir -p "${publish_dir}"
          cp -a repo/. "${publish_dir}/"
          touch "${publish_dir}/.nojekyll"

          git -C "${publish_dir}" init
          git -C "${publish_dir}" checkout -B gh-pages
          git -C "${publish_dir}" config user.name "github-actions[bot]"
          git -C "${publish_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${publish_dir}" add -A
          git -C "${publish_dir}" commit -m "Publish networkoctopus Flatpak repo for ${GITHUB_SHA}"
          git -C "${publish_dir}" remote add origin "https://x-access-token:${FLATPAK_PUBLISH_TOKEN}@github.com/networkoctopus/flatpak.git"
          git -C "${publish_dir}" push --force origin gh-pages

name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_ID: io.github.networkoctopus.Crumbs
  MANIFEST: io.github.networkoctopus.Crumbs.Devel.yml
  FLATPAK_REMOTE_NAME: networkoctopus
  FLATPAK_REPO_URL: https://networkoctopus.github.io/flatpak/
  FLATPAKREPO_FILE: networkoctopus.flatpakrepo

jobs:
  build:
    name: Build Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            elf_machine: Advanced Micro Devices X86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            elf_machine: AArch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dbus-x11 flatpak flatpak-builder gpg

      - name: Add Flathub
        run: |
          dbus-run-session -- flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install runtimes
        run: |
          dbus-run-session -- flatpak --user install -y flathub \
            org.gnome.Platform//50 \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Import GPG signing key
        id: gpg
        shell: bash
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "${FLATPAK_GPG_PRIVATE_KEY}" || -z "${FLATPAK_GPG_KEY_ID}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Flatpak GPG signing secrets configured; building an unsigned repository."
            exit 0
          fi

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\n' > ~/.gnupg/gpg-agent.conf
          printf 'batch\nno-tty\npinentry-mode loopback\n' > ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

          printf '%s' "${FLATPAK_GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --batch --list-secret-keys "${FLATPAK_GPG_KEY_ID}"

          if [[ -n "${FLATPAK_GPG_PASSPHRASE}" ]]; then
            printf 'crumbs signing probe' > /tmp/crumbs-signing-probe
            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "${FLATPAK_GPG_PASSPHRASE}" \
              --local-user "${FLATPAK_GPG_KEY_ID}" \
              --detach-sign \
              /tmp/crumbs-signing-probe
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build architecture repository
        shell: bash
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          SIGNED: ${{ steps.gpg.outputs.signed }}
        run: |
          set -euo pipefail

          sign_args=()
          if [[ "${SIGNED}" == "true" ]]; then
            sign_args+=(--gpg-sign="${FLATPAK_GPG_KEY_ID}")
          fi

          dbus-run-session -- flatpak-builder \
            --user \
            --arch="${{ matrix.arch }}" \
            --force-clean \
            --install-deps-from=flathub \
            --repo=repo \
            "${sign_args[@]}" \
            build-dir \
            "${MANIFEST}"

      - name: Verify architecture and PBS startup
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_ELF_MACHINE: ${{ matrix.elf_machine }}
        run: |
          set -euo pipefail

          test "$(flatpak --default-arch)" = "${EXPECTED_ARCH}"

          for binary in crumbs proxmox-backup-client; do
            readelf -h "build-dir/files/bin/${binary}" | grep -F "Machine:" | grep -F "${EXPECTED_ELF_MACHINE}"
          done

          test -e build-dir/files/lib/libfuse3.so.3
          find build-dir/files/lib -maxdepth 1 -name 'libfuse3.so*' -ls

          readelf -d build-dir/files/bin/proxmox-backup-client | tee pbs-dynamic.txt
          expected_runpath="\$ORIGIN/../lib"
          grep -F "${expected_runpath}" pbs-dynamic.txt

          dbus-run-session -- flatpak-builder \
            --run \
            --arch="${EXPECTED_ARCH}" \
            build-dir \
            "${MANIFEST}" \
            ldd /app/bin/proxmox-backup-client | tee pbs-ldd.txt
          if grep -F "not found" pbs-ldd.txt; then
            exit 1
          fi

          dbus-run-session -- flatpak-builder \
            --run \
            --arch="${EXPECTED_ARCH}" \
            build-dir \
            "${MANIFEST}" \
            /app/bin/proxmox-backup-client version | tee pbs-version.txt
          grep -F "client version: 4.2.0" pbs-version.txt

      - name: Build architecture bundle
        run: |
          flatpak build-bundle \
            --arch="${{ matrix.arch }}" \
            repo \
            "${APP_ID}-${{ matrix.arch }}.flatpak" \
            "${APP_ID}" \
            master

      - name: Archive architecture repository
        run: |
          tar -C repo -czf "repo-${{ matrix.arch }}.tar.gz" .

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: crumbs-flatpak-bundle-${{ matrix.arch }}
          path: ${{ env.APP_ID }}-${{ matrix.arch }}.flatpak

      - name: Upload architecture repository
        uses: actions/upload-artifact@v4
        with:
          name: crumbs-flatpak-repository-${{ matrix.arch }}
          path: repo-${{ matrix.arch }}.tar.gz

  assemble:
    name: Assemble multi-architecture repository
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak gpg ostree

      - name: Download architecture repositories
        uses: actions/download-artifact@v4
        with:
          pattern: crumbs-flatpak-repository-*
          path: architecture-repos
          merge-multiple: true

      - name: Merge architecture repositories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p repo arm-repo
          tar -xzf architecture-repos/repo-x86_64.tar.gz -C repo
          tar -xzf architecture-repos/repo-aarch64.tar.gz -C arm-repo

          while IFS= read -r ref; do
            ostree --repo=repo pull-local arm-repo "${ref}"
          done < <(ostree --repo=arm-repo refs)

          ostree --repo=repo refs | sort

      - name: Import GPG signing key
        id: gpg
        shell: bash
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [[ -z "${FLATPAK_GPG_PRIVATE_KEY}" || -z "${FLATPAK_GPG_KEY_ID}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No Flatpak GPG signing secrets configured; assembling an unsigned repository."
            exit 0
          fi

          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf 'allow-loopback-pinentry\n' > ~/.gnupg/gpg-agent.conf
          printf 'batch\nno-tty\npinentry-mode loopback\n' > ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

          printf '%s' "${FLATPAK_GPG_PRIVATE_KEY}" | gpg --batch --import
          gpg --batch --list-secret-keys "${FLATPAK_GPG_KEY_ID}"

          if [[ -n "${FLATPAK_GPG_PASSPHRASE}" ]]; then
            printf 'crumbs signing probe' > /tmp/crumbs-signing-probe
            gpg \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --passphrase "${FLATPAK_GPG_PASSPHRASE}" \
              --local-user "${FLATPAK_GPG_KEY_ID}" \
              --detach-sign \
              /tmp/crumbs-signing-probe
          fi

          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Update repository metadata
        shell: bash
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          SIGNED: ${{ steps.gpg.outputs.signed }}
        run: |
          set -euo pipefail

          update_args=(--generate-static-deltas --prune)
          if [[ "${SIGNED}" == "true" ]]; then
            update_args+=(--gpg-sign="${FLATPAK_GPG_KEY_ID}")
          fi

          flatpak build-update-repo "${update_args[@]}" repo

      - name: Generate flatpakrepo file
        shell: bash
        env:
          FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          SIGNED: ${{ steps.gpg.outputs.signed }}
        run: |
          set -euo pipefail

          gpg_key=""
          no_gpg_verify="true"

          if [[ "${SIGNED}" == "true" ]]; then
            gpg_key="$(gpg --armor --export "${FLATPAK_GPG_KEY_ID}" | base64 -w0)"
            no_gpg_verify="false"
          fi

          python3 build-aux/render-flatpakrepo.py \
            --template build-aux/io.github.networkoctopus.Crumbs.flatpakrepo.in \
            --output "repo/${FLATPAKREPO_FILE}" \
            --repo-url "${FLATPAK_REPO_URL}" \
            --gpg-key "${gpg_key}" \
            --no-gpg-verify "${no_gpg_verify}"

      - name: Upload multi-architecture repository
        uses: actions/upload-artifact@v4
        with:
          name: networkoctopus-flatpak-repo
          path: repo
          include-hidden-files: true

      - name: Publish shared networkoctopus Flatpak repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.gpg.outputs.signed == 'true'
        shell: bash
        env:
          FLATPAK_PUBLISH_TOKEN: ${{ secrets.FLATPAK_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${FLATPAK_PUBLISH_TOKEN}" ]]; then
            echo "::error::FLATPAK_PUBLISH_TOKEN is required to publish networkoctopus/flatpak"
            exit 1
          fi

          publish_dir="${RUNNER_TEMP}/networkoctopus-flatpak-pages"
          rm -rf "${publish_dir}"
          mkdir -p "${publish_dir}"
          cp -a repo/. "${publish_dir}/"
          touch "${publish_dir}/.nojekyll"

          git -C "${publish_dir}" init
          git -C "${publish_dir}" checkout -B gh-pages
          git -C "${publish_dir}" config user.name "github-actions[bot]"
          git -C "${publish_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${publish_dir}" add -A
          git -C "${publish_dir}" commit -m "Publish networkoctopus Flatpak repo for ${GITHUB_SHA}"
          git -C "${publish_dir}" remote add origin "https://x-access-token:${FLATPAK_PUBLISH_TOKEN}@github.com/networkoctopus/flatpak.git"
          git -C "${publish_dir}" push --force origin gh-pages
